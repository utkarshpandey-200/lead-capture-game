<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#072559" />
<title>Credit Union Quiz (Preview)</title>
<style>
  :root {
    --brand-primary: #072559;
    --brand-secondary: #f5b731;
    --brand-accent: #0f8b4c;
    --color-bg: #f5f8fd;
    --color-surface: #ffffff;
    --color-text: #0b1a33;
    --color-text-muted: #5c6f8c;
    --color-border: #dde5f0;
    --color-danger: #c0392b;
    --radius-sm: 8px;
    --radius-md: 14px;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --space-7: 48px;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "DM Sans", sans-serif;
    --transition-fast: 150ms ease;
    --transition-med: 300ms ease;
    --shadow-sm: 0 1px 2px rgba(7, 37, 89, 0.07);
    --shadow-md: 0 10px 28px rgba(7, 37, 89, 0.14);
    --shadow-lg: 0 22px 50px rgba(7, 37, 89, 0.2);
    --ring-gold: 0 0 0 4px rgba(245, 183, 49, 0.25);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(circle at 10% -8%, color-mix(in srgb, var(--brand-secondary) 20%, transparent), transparent 42%),
      radial-gradient(circle at 105% 6%, color-mix(in srgb, var(--brand-accent) 16%, transparent), transparent 38%),
      radial-gradient(circle at 50% 115%, color-mix(in srgb, var(--brand-primary) 10%, transparent), transparent 45%),
      var(--color-bg);
    background-attachment: fixed;
    color: var(--color-text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  button { font-family: inherit; }
  a { color: var(--brand-primary); }

  @keyframes pop-in {
    0% { transform: scale(0.7); opacity: 0.3; }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes fade-slide-up {
    0% { transform: translateY(10px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
  @keyframes pulse-scale {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }
  @keyframes btn-pulse-glow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(245, 183, 49, 0.55), var(--shadow-md); }
    50% { box-shadow: 0 0 0 12px rgba(245, 183, 49, 0), var(--shadow-md); }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn-pulse, .pulse { animation: none !important; }
  }

  .screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: var(--space-5) var(--space-4) var(--space-7);
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
  }
  .brand-header { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-5); }
  .brand-header img { height: 40px; width: auto; }
  .preview-note {
    font-size: 0.72rem;
    color: var(--color-text-muted);
    text-align: center;
    margin-top: var(--space-2);
  }
  .screen-title { font-size: 1.6rem; font-weight: 800; line-height: 1.25; margin: 0 0 var(--space-3); color: var(--brand-primary); }
  .hero-title {
    font-size: 2.2rem;
    line-height: 1.15;
    background: linear-gradient(135deg, var(--brand-primary), color-mix(in srgb, var(--brand-primary) 55%, var(--brand-accent)));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .screen-body { font-size: 1rem; color: var(--color-text-muted); line-height: 1.5; margin: 0 0 var(--space-5); }
  .eyebrow-badge {
    display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
    padding: 7px 16px; border-radius: 999px;
    background: linear-gradient(135deg, var(--brand-secondary), color-mix(in srgb, var(--brand-secondary) 70%, #ffb000));
    color: #2b1900; font-weight: 800; font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase;
    margin-bottom: var(--space-4); box-shadow: var(--shadow-sm); animation: fade-slide-up 500ms ease;
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: var(--space-2); margin: 0 0 var(--space-5); }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 15px; border-radius: 999px;
    background: var(--color-surface); border: 1.5px solid var(--color-border);
    font-weight: 700; font-size: 0.85rem; box-shadow: var(--shadow-sm);
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
    min-height: 56px; padding: var(--space-3) var(--space-5); border-radius: var(--radius-md);
    border: 2px solid transparent; font-size: 1.05rem; font-weight: 700; cursor: pointer;
    transition: transform var(--transition-fast), background var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
    width: 100%; text-decoration: none;
  }
  .btn:disabled { cursor: not-allowed; opacity: 0.55; }
  .btn-primary {
    background: linear-gradient(135deg, var(--brand-primary), color-mix(in srgb, var(--brand-primary) 75%, #1a3f8f));
    color: #ffffff; box-shadow: var(--shadow-md);
  }
  .btn-primary:not(:disabled):hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .btn-primary:not(:disabled):active { transform: translateY(0) scale(0.98); box-shadow: var(--shadow-sm); }
  .btn-pulse { animation: btn-pulse-glow 2.4s ease-in-out infinite; }
  .btn-secondary { background: var(--color-surface); color: var(--brand-primary); border-color: var(--brand-primary); }
  .btn-secondary:not(:disabled):hover { background: color-mix(in srgb, var(--brand-primary) 8%, var(--color-surface)); transform: translateY(-1px); box-shadow: var(--shadow-sm); }

  .field { margin-bottom: var(--space-4); }
  .field label { display: block; font-weight: 600; margin-bottom: var(--space-2); font-size: 0.92rem; }
  .field input[type="text"],
  .field input[type="email"] {
    width: 100%; min-height: 52px; padding: 0 var(--space-4); border-radius: var(--radius-md);
    border: 2px solid var(--color-border); background: var(--color-surface); color: var(--color-text); font-size: 1rem;
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
  }
  .field input:focus-visible { outline: none; border-color: var(--brand-secondary); box-shadow: var(--ring-gold); }
  .field-error { color: var(--color-danger); font-size: 0.85rem; margin-top: var(--space-1); }
  .radio-group { display: flex; flex-direction: column; gap: var(--space-2); }
  .radio-option {
    display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-3);
    border: 2px solid var(--color-border); border-radius: var(--radius-md); cursor: pointer;
    transition: border-color var(--transition-fast), background var(--transition-fast), box-shadow var(--transition-fast);
  }
  .radio-option:hover { border-color: color-mix(in srgb, var(--brand-primary) 40%, var(--color-border)); }
  .radio-option input { margin-top: 3px; width: 20px; height: 20px; accent-color: var(--brand-primary); }
  .radio-option.selected {
    border-color: var(--brand-secondary); background: color-mix(in srgb, var(--brand-secondary) 10%, var(--color-surface));
    box-shadow: var(--shadow-sm);
  }
  .checkbox-row { display: flex; align-items: flex-start; gap: var(--space-3); margin-bottom: var(--space-4); }
  .checkbox-row input { margin-top: 3px; width: 22px; height: 22px; flex-shrink: 0; }
  .checkbox-row label { font-size: 0.92rem; line-height: 1.4; color: var(--color-text-muted); }

  .progress-dots { display: flex; gap: 7px; margin-bottom: var(--space-4); }
  .progress-dot { height: 8px; flex: 1; border-radius: 999px; background: var(--color-border); transition: background var(--transition-med), transform var(--transition-med); }
  .progress-dot.done { background: var(--brand-accent); }
  .progress-dot.current { background: var(--brand-secondary); transform: scaleY(1.5); }

  .quiz-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-3); font-weight: 700; color: var(--brand-primary); }
  .quiz-score {
    display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px; border-radius: 999px;
    background: linear-gradient(135deg, var(--brand-secondary), color-mix(in srgb, var(--brand-secondary) 70%, #ffb000));
    color: #2b1900; font-size: 0.9rem; font-weight: 800; animation: pop-in 320ms ease;
  }
  .countdown-row { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-5); }
  .countdown-track { flex: 1; width: 100%; height: 12px; border-radius: 999px; background: var(--color-border); overflow: hidden; }
  .countdown-fill { height: 100%; background: var(--brand-accent); border-radius: 999px; transition: width 120ms linear, background var(--transition-med); }
  .countdown-fill.warn { background: var(--brand-secondary); }
  .countdown-fill.urgent { background: var(--color-danger); }
  .countdown-seconds { font-weight: 800; font-variant-numeric: tabular-nums; min-width: 2.6em; text-align: right; color: var(--color-text-muted); }
  .countdown-seconds.urgent { color: var(--color-danger); animation: pulse-scale 0.6s ease-in-out infinite; }

  .question-category {
    display: inline-flex; padding: 4px 12px; border-radius: 999px; background: color-mix(in srgb, var(--brand-primary) 8%, var(--color-surface));
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--brand-primary); font-weight: 800; margin-bottom: var(--space-3);
  }
  .question-category-bonus {
    background: linear-gradient(135deg, var(--brand-secondary), color-mix(in srgb, var(--brand-secondary) 70%, #ffb000));
    color: #2b1900; animation: pop-in 320ms ease;
  }

  .bonus-intro {
    position: relative; flex: 1; min-height: 420px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; gap: var(--space-2); padding: var(--space-6) var(--space-4);
    margin: calc(var(--space-5) * -1) calc(var(--space-4) * -1) calc(var(--space-7) * -1);
    border-radius: var(--radius-md); overflow: hidden;
    background:
      radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--brand-secondary) 55%, transparent), transparent 60%),
      radial-gradient(circle at 15% 90%, color-mix(in srgb, var(--brand-accent) 22%, transparent), transparent 55%),
      radial-gradient(circle at 88% 12%, color-mix(in srgb, var(--brand-primary) 28%, transparent), transparent 55%),
      var(--color-surface);
  }
  .bonus-intro-ring {
    position: absolute; top: 50%; left: 50%; width: 130px; height: 130px; margin: -65px 0 0 -65px;
    border-radius: 50%; border: 3px solid color-mix(in srgb, var(--brand-secondary) 70%, transparent);
    animation: bonus-ring-pulse 2.2s ease-out infinite;
  }
  .bonus-intro-ring-2 { animation-delay: 1.1s; }
  @keyframes bonus-ring-pulse {
    0% { transform: scale(0.5); opacity: 0.9; }
    100% { transform: scale(2.6); opacity: 0; }
  }
  .bonus-intro-icon {
    position: relative; font-size: 4.2rem; line-height: 1;
    animation: bonus-icon-pop 700ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
    filter: drop-shadow(0 10px 18px rgba(7, 37, 89, 0.25));
  }
  @keyframes bonus-icon-pop {
    0% { transform: scale(0) rotate(-25deg); opacity: 0; }
    60% { transform: scale(1.25) rotate(8deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .bonus-intro-title {
    position: relative; margin: var(--space-2) 0 0; font-size: 2.1rem; font-weight: 900; letter-spacing: 0.01em;
    background: linear-gradient(110deg, var(--brand-primary) 20%, color-mix(in srgb, var(--brand-secondary) 85%, #ffdd88) 45%, var(--brand-primary) 70%);
    background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: bonus-text-in 500ms ease 150ms both, bonus-shine 2.4s linear 650ms infinite;
  }
  @keyframes bonus-text-in {
    0% { transform: translateY(12px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
  @keyframes bonus-shine {
    0% { background-position: 200% 0; }
    100% { background-position: -40% 0; }
  }
  .bonus-intro-subtitle {
    position: relative; margin: 0; font-weight: 700; color: var(--color-text-muted);
    animation: fade-slide-up 500ms ease 350ms both;
  }
  .bonus-intro-btn { position: relative; margin-top: var(--space-4); animation: fade-slide-up 500ms ease 550ms both; }
  @media (prefers-reduced-motion: reduce) {
    .bonus-intro-ring, .bonus-intro-icon, .bonus-intro-title, .bonus-intro-subtitle, .bonus-intro-btn { animation: none !important; }
  }

  .question-prompt { font-size: 1.35rem; font-weight: 800; line-height: 1.35; margin: 0 0 var(--space-5); color: var(--brand-primary); }
  .options-list { display: flex; flex-direction: column; gap: var(--space-3); }
  .option-btn {
    display: flex; align-items: center; gap: var(--space-3); min-height: 60px; width: 100%;
    padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); border: 2px solid var(--color-border);
    background: var(--color-surface); color: var(--color-text); font-size: 1rem; font-weight: 600; text-align: left;
    cursor: pointer; box-shadow: var(--shadow-sm);
    transition: border-color var(--transition-fast), background var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast), opacity var(--transition-fast);
  }
  .option-btn:not(:disabled):hover { border-color: var(--brand-primary); transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .option-btn:not(:disabled):active { transform: translateY(0) scale(0.98); }
  .option-btn:disabled { cursor: default; }
  .option-btn:disabled:not(.correct):not(.incorrect) { opacity: 0.5; }
  .option-letter {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
    background: color-mix(in srgb, var(--brand-primary) 8%, var(--color-surface)); border: 1.5px solid var(--color-border);
    color: var(--brand-primary); display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 800;
    transition: background var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);
  }
  .option-btn.correct { border-color: var(--brand-accent); background: color-mix(in srgb, var(--brand-accent) 14%, var(--color-surface)); box-shadow: var(--shadow-md); animation: pop-in 280ms ease; }
  .option-btn.incorrect { border-color: var(--color-danger); background: color-mix(in srgb, var(--color-danger) 10%, var(--color-surface)); animation: pop-in 280ms ease; }
  .option-btn.chosen-wrong .option-letter { background: var(--color-danger); border-color: var(--color-danger); color: #fff; }
  .option-btn.correct .option-letter { background: var(--brand-accent); border-color: var(--brand-accent); color: #fff; }
  .option-result-icon { margin-left: auto; flex-shrink: 0; font-size: 1.2rem; font-weight: 900; }
  .option-btn.correct .option-result-icon { color: var(--brand-accent); }
  .option-btn.incorrect .option-result-icon { color: var(--color-danger); }

  .feedback-panel {
    margin-top: var(--space-5); padding: var(--space-4); border-radius: var(--radius-md); background: var(--color-surface);
    border: 1.5px solid var(--color-border); border-left: 5px solid var(--color-border); box-shadow: var(--shadow-md);
    animation: fade-slide-up 350ms ease;
  }
  .feedback-panel.correct { border-left-color: var(--brand-accent); }
  .feedback-panel.incorrect { border-left-color: var(--color-danger); }
  .feedback-headline { display: flex; align-items: center; gap: var(--space-2); font-weight: 800; font-size: 1.15rem; margin-bottom: var(--space-2); }
  .feedback-headline .feedback-icon { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; font-size: 0.95rem; color: #fff; }
  .feedback-headline.correct { color: var(--brand-accent); }
  .feedback-headline.correct .feedback-icon { background: var(--brand-accent); }
  .feedback-headline.incorrect { color: var(--color-danger); }
  .feedback-headline.incorrect .feedback-icon { background: var(--color-danger); }
  .feedback-points {
    display: inline-block; font-weight: 800; color: var(--brand-primary);
    background: color-mix(in srgb, var(--brand-secondary) 18%, var(--color-surface)); padding: 3px 12px; border-radius: 999px;
    margin-bottom: var(--space-3); animation: pop-in 380ms ease;
  }
  .feedback-explanation { color: var(--color-text-muted); font-size: 0.95rem; line-height: 1.45; margin: 0 0 var(--space-4); }

  .result-score-wrap { position: relative; display: flex; flex-direction: column; align-items: flex-start; }
  .result-score-wrap::before {
    content: ""; position: absolute; top: -20px; left: -30px; width: 180px; height: 180px;
    background: radial-gradient(circle, color-mix(in srgb, var(--brand-secondary) 45%, transparent), transparent 70%);
    filter: blur(6px); z-index: -1;
  }
  .result-score {
    font-size: 3.4rem; font-weight: 900; margin: 0; line-height: 1;
    background: linear-gradient(135deg, var(--brand-primary), color-mix(in srgb, var(--brand-primary) 55%, var(--brand-accent)));
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: pop-in 500ms ease;
  }
  .result-score-label { color: var(--color-text-muted); font-weight: 600; margin-bottom: var(--space-5); }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); margin-bottom: var(--space-5); }
  .stat-card { background: var(--color-surface); border: 1.5px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-4); box-shadow: var(--shadow-sm); }
  .stat-card .value { font-size: 1.6rem; font-weight: 800; color: var(--brand-primary); }
  .stat-card .label { font-size: 0.8rem; color: var(--color-text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .cta-row { display: flex; flex-direction: column; gap: var(--space-3); margin-top: var(--space-5); }
  .spacer { flex: 1; }

  .confetti-burst { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 50; }
  .confetti-piece { position: absolute; top: -5vh; border-radius: 2px; opacity: 0.9; animation-name: confetti-fall; animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94); animation-fill-mode: forwards; }
  @keyframes confetti-fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) rotate(540deg); opacity: 0; }
  }

  /* Below this width, .screen keeps its mobile layout: full-bleed, top-aligned,
     min-height: 100vh (its default rule above). At this width and up it becomes
     a centered card instead of a narrow column pinned to the top-left of a wide
     viewport. #app always renders a single .screen, so no :has() scoping needed. */
  @media (min-width: 768px) {
    #app {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6) var(--space-4);
    }
    .screen {
      min-height: 0;
      max-height: calc(100vh - var(--space-6) * 2);
      overflow-y: auto;
      width: 100%;
      max-width: 560px;
      margin: 0;
      padding: var(--space-6);
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
    }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>

            '<label for="lastName">Last name</label>' +
            '<input type="text" id="lastName" autocomplete="family-name" value="' + escapeHtml(s.lastName) + '" />' +
            (s.errors.lastName ? '<div class="field-error">' + s.errors.lastName + '</div>' : '') +
          '</div>' +
          '<div class="field">' +
            '<label for="organization">Credit union / organization</label>' +
            '<input type="text" id="organization" autocomplete="organization" value="' + escapeHtml(s.organization) + '" />' +
            (s.errors.organization ? '<div class="field-error">' + s.errors.organization + '</div>' : '') +
          '</div>' +
          '<div class="checkbox-row">' +
            '<input type="checkbox" id="consent"' + (s.consent ? " checked" : "") + ' />' +
            '<label for="consent">' + CONFIG.consentText + ' <a href="' + CONFIG.privacyPolicyUrl + '" target="_blank" rel="noreferrer">Privacy policy</a>.</label>' +
          '</div>' +
          (s.errors.consent ? '<div class="field-error" style="margin-top:-8px;margin-bottom:16px;">' + s.errors.consent + '</div>' : '') +
          '<button class="btn btn-primary" type="submit">Start the quiz</button>' +
        '</form>' +
      '</div>';

    var form = document.getElementById("registerForm");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      syncRegisterFields();
      if (validateRegister()) startQuiz();
      else render();
    });
  }

  function syncRegisterFields() {
    var get = function (id) { var el = document.getElementById(id); return el ? el.value : ""; };
    state.firstName = get("firstName");
    state.lastName = get("lastName");
    state.organization = get("organization");
    var consentEl = document.getElementById("consent");
    if (consentEl) state.consent = consentEl.checked;
  }

  function validateRegister() {
    var s = state;
    var errors = {};
    if (!s.firstName.trim()) errors.firstName = "Required";
    if (!s.lastName.trim()) errors.lastName = "Required";
    if (!s.organization.trim()) errors.organization = "Required";
    if (!s.consent) errors.consent = "Consent is required to play";
    state.errors = errors;
    return Object.keys(errors).length === 0;
  }

  function startQuiz() {
    state.step = "quiz";
    state.questions = shuffle(QUESTIONS).slice(0, KNOWLEDGE_COUNT).concat([BONUS_QUESTION]);
    state.current = 0;
    state.score = 0;
    state.numCorrect = 0;
    state.answerTimesMs = [];
    render();
    beginQuestion();
  }

  function beginQuestion() {
    state.selectedIndex = null;
    state.locked = false;
    state.outcome = null;
    state.remainingMs = CONFIG.limitMs;
    state.questionStartedAt = performance.now();
    renderQuiz();
    stopTimer();
    state.timerId = setInterval(tickTimer, 100);
  }

  function stopTimer() {
    if (state.timerId) {
      clearInterval(state.timerId);
      state.timerId = null;
    }
  }

  function tickTimer() {
    var elapsed = performance.now() - state.questionStartedAt;
    state.remainingMs = Math.max(0, CONFIG.limitMs - elapsed);
    updateCountdown();
    if (state.remainingMs <= 0 && !state.locked) {
      submitAnswer(null);
    }
  }

  function updateCountdown() {
    var fraction = state.remainingMs / CONFIG.limitMs;
    var tier = fraction <= 0.25 ? "urgent" : fraction <= 0.5 ? "warn" : "safe";
    var fill = document.getElementById("countdownFill");
    var seconds = document.getElementById("countdownSeconds");
    if (!fill || !seconds) return;
    fill.style.width = (fraction * 100) + "%";
    fill.className = "countdown-fill" + (tier !== "safe" ? " " + tier : "");
    var secs = Math.ceil(state.remainingMs / 1000);
    seconds.textContent = secs + "s";
    seconds.className = "countdown-seconds" + (tier === "urgent" ? " urgent" : "");
  }

  function submitAnswer(chosenIndex) {
    if (state.locked) return;
    stopTimer();
    state.locked = true;
    state.selectedIndex = chosenIndex;
    var elapsedMs = CONFIG.limitMs - state.remainingMs;
    var q = state.questions[state.current];
    var correct = chosenIndex === q.correctIndex;
    var points = computePoints(correct, elapsedMs);
    state.score += points;
    if (correct) state.numCorrect += 1;
    state.answerTimesMs.push(Math.min(elapsedMs, CONFIG.limitMs));
    state.outcome = { correct: correct, points: points, explanation: q.explanation };
    renderQuiz();
  }

  function nextQuestion() {
    if (state.current + 1 >= state.questions.length) {
      state.step = "result";
      render();
      return;
    }
    var next = state.questions[state.current + 1];
    if (next && next.isBonus) {
      // Its own announcement screen, not a badge on the question card — the
      // actual question (and its timer) only starts once this is dismissed.
      state.step = "bonus-intro";
      render();
      return;
    }
    state.current += 1;
    beginQuestion();
  }

  function proceedPastBonusIntro() {
    state.current += 1;
    beginQuestion();
  }

  function renderBonusIntro() {
    app.innerHTML =
      '<div class="screen">' +
        '<div class="bonus-intro" role="status" aria-live="polite">' +
          '<span class="bonus-intro-ring bonus-intro-ring-1"></span>' +
          '<span class="bonus-intro-ring bonus-intro-ring-2"></span>' +
          '<span class="bonus-intro-icon">🎁</span>' +
          '<h2 class="bonus-intro-title">Bonus Question!</h2>' +
          '<p class="bonus-intro-subtitle">Final question — make it count.</p>' +
          '<button type="button" class="btn btn-primary bonus-intro-btn" id="bonusGoBtn">Next →</button>' +
        '</div>' +
      '</div>';
    fireConfetti();

    var fired = false;
    function fire() {
      if (fired) return;
      fired = true;
      proceedPastBonusIntro();
    }
    var btn = document.getElementById("bonusGoBtn");
    if (btn) btn.addEventListener("click", fire);
  }

  function renderQuiz() {
    var q = state.questions[state.current];
    var dots = "";
    for (var i = 0; i < state.questions.length; i++) {
      var cls = i < state.current ? "done" : i === state.current ? "current" : "";
      dots += '<span class="progress-dot ' + cls + '"></span>';
    }

    var optionsHtml = "";
    for (var idx = 0; idx < q.options.length; idx++) {
      var letter = String.fromCharCode(65 + idx);
      var cls2 = "option-btn";
      var icon = "";
      if (state.locked && state.outcome) {
        if (idx === q.correctIndex) { cls2 += " correct"; icon = '<span class="option-result-icon">✓</span>'; }
        else if (idx === state.selectedIndex) { cls2 += " incorrect chosen-wrong"; icon = '<span class="option-result-icon">✕</span>'; }
      }
      optionsHtml +=
        '<button type="button" class="' + cls2 + '" data-idx="' + idx + '" ' + (state.locked ? "disabled" : "") + '>' +
          '<span class="option-letter">' + letter + '</span>' +
          '<span>' + escapeHtml(q.options[idx]) + '</span>' +
          icon +
        '</button>';
    }

    var feedbackHtml = "";
    if (state.outcome) {
      var outcomeClass = state.outcome.correct ? "correct" : "incorrect";
      feedbackHtml =
        '<div class="feedback-panel ' + outcomeClass + '">' +
          '<div class="feedback-headline ' + outcomeClass + '">' +
            '<span class="feedback-icon">' + (state.outcome.correct ? "✓" : "✕") + '</span>' +
            (state.outcome.correct ? "Correct!" : "Incorrect") +
          '</div>' +
          '<div class="feedback-points">+' + state.outcome.points + ' points</div>' +
          '<p class="feedback-explanation">' + escapeHtml(state.outcome.explanation) + '</p>' +
          '<button class="btn btn-secondary" id="nextBtn">Next →</button>' +
        '</div>';
    }

    app.innerHTML =
      '<div class="screen">' +
        '<div class="progress-dots">' + dots + '</div>' +
        '<div class="quiz-header-row">' +
          '<span>Question ' + (state.current + 1) + ' of ' + state.questions.length + '</span>' +
          '<span class="quiz-score">⚡ ' + state.score + '</span>' +
        '</div>' +
        '<div class="countdown-row">' +
          '<div class="countdown-track"><div class="countdown-fill" id="countdownFill" style="width:100%"></div></div>' +
          '<span class="countdown-seconds" id="countdownSeconds">' + (CONFIG.limitMs / 1000) + 's</span>' +
        '</div>' +
        '<div class="question-category' + (q.isBonus ? ' question-category-bonus' : '') + '">' + q.category + '</div>' +
        '<h2 class="question-prompt">' + escapeHtml(q.prompt) + '</h2>' +
        '<div class="options-list">' + optionsHtml + '</div>' +
        feedbackHtml +
      '</div>';

    updateCountdown();

    if (!state.locked) {
      var btns = app.querySelectorAll(".option-btn");
      btns.forEach(function (btn) {
        btn.addEventListener("click", function () {
          submitAnswer(parseInt(btn.getAttribute("data-idx"), 10));
        });
      });
    } else {
      var nextBtn = document.getElementById("nextBtn");
      if (nextBtn) nextBtn.addEventListener("click", nextQuestion);
    }
  }

  function fireConfetti() {
    if (prefersReducedMotion()) return;
    var colors = ["var(--brand-secondary)", "var(--brand-accent)", "var(--brand-primary)", "#ffffff"];
    var wrap = document.createElement("div");
    wrap.className = "confetti-burst";
    for (var i = 0; i < 28; i++) {
      var piece = document.createElement("span");
      piece.className = "confetti-piece";
      var width = 6 + Math.round(Math.random() * 6);
      piece.style.left = (Math.random() * 100) + "%";
      piece.style.animationDelay = (Math.random() * 0.4) + "s";
      piece.style.animationDuration = (1.8 + Math.random() * 1.1) + "s";
      piece.style.background = colors[i % colors.length];
      piece.style.width = width + "px";
      piece.style.height = Math.round(width * 0.4) + "px";
      piece.style.transform = "rotate(" + Math.round(Math.random() * 360) + "deg)";
      wrap.appendChild(piece);
    }
    document.body.appendChild(wrap);
    setTimeout(function () {
      if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
    }, 3200);
  }

  function renderResult() {
    var maxScore = state.questions.length * (CONFIG.basePoints + CONFIG.speedBonus);
    var avgMs = state.answerTimesMs.length
      ? state.answerTimesMs.reduce(function (a, b) { return a + b; }, 0) / state.answerTimesMs.length
      : 0;

    app.innerHTML =
      '<div class="screen">' +
        '<p class="result-score-label">Your score</p>' +
        '<div class="result-score-wrap"><p class="result-score">' + state.score.toLocaleString() + '</p></div>' +
        '<p class="result-score-label" style="margin-bottom:var(--space-5);">out of ' + maxScore.toLocaleString() + '</p>' +
        '<div class="stat-grid">' +
          '<div class="stat-card"><div class="value">' + state.numCorrect + '/' + state.questions.length + '</div><div class="label">Correct</div></div>' +
          '<div class="stat-card"><div class="value">' + (avgMs / 1000).toFixed(1) + 's</div><div class="label">Avg. answer time</div></div>' +
        '</div>' +
        '<div class="cta-row">' +
          '<a class="btn btn-primary" href="' + CONFIG.bookingUrl + '" target="_blank" rel="noreferrer">Book 30 minutes with our team</a>' +
          '<a class="btn btn-secondary" href="' + CONFIG.websiteUrl + '" target="_blank" rel="noreferrer">🌐 Visit Website</a>' +
        '</div>' +
        '<p class="preview-note">Preview build for testing — scores aren’t saved or shared with the live event leaderboard.</p>' +
      '</div>';

    fireConfetti();
  }

  render();
})();
</script>
</body>
</html>
